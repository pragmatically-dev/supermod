name: 🐞 Bug report
description: Something in SuperMod isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can — the device log is the single most useful thing you can attach.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you start
      options:
        - label: I'm on a **reMarkable 1 or 2** (SuperMod does not support Paper Pro / Paper Pro Move / Paper Pure).
          required: true
        - label: My device is running reMarkable OS **3.27.1.0** (the only supported firmware).
          required: true
        - label: I searched existing issues and this isn't a duplicate.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I open the Planner and tap a day, …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: reMarkable OS version
      placeholder: "3.27.1.0"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - reMarkable 2
        - reMarkable 1
    validations:
      required: true
  - type: textarea
    id: extensions
    attributes:
      label: xovi extensions loaded
      description: Output of `ls ~/xovi/extensions.d/` on the device, plus versions if you know them.
      render: shell
  - type: textarea
    id: log
    attributes:
      label: Device log
      description: |
        The ground truth. Capture the xochitl log right after the bug and paste the relevant lines — especially anything like `Error while processing`, `ReferenceError`, `is not a type`, or `no signal of the target matches`.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / anything else
